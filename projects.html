<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      var stored = localStorage.getItem('portfolio-theme') || 'system';
      var dark = stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="icon" href="/favicon/KKFavicon2.png" sizes="any" type="image/png"/>
  <link rel="manifest" href="/manifest.json" />
  <title>Loading…</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">
  <div id="navbar"></div>

  <main id="main-content" class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-16">
    <h1 class="text-3xl font-bold mb-2">Projects</h1>
    <p class="text-slate-600 dark:text-slate-400 mb-8">A selection of things I've built.</p>

    <div class="flex flex-col sm:flex-row gap-4 sm:items-center sm:justify-between mb-8">
      <div id="filter-buttons" class="flex flex-wrap gap-2" role="group" aria-label="Filter projects by category"></div>
      <label class="relative w-full sm:w-64">
        <span class="sr-only">Search projects</span>
        <input id="project-search" type="search" placeholder="Search projects…"
          class="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </label>
    </div>

    <div id="projects-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="skeleton h-72"></div>
      <div class="skeleton h-72"></div>
      <div class="skeleton h-72"></div>
    </div>
    <p id="no-results" class="hidden text-center text-slate-500 dark:text-slate-400 py-16">No projects match your search.</p>
  </main>

  <div id="footer"></div>
  <script type="module" src="/assets/js/pages/projects.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      var stored = localStorage.getItem('portfolio-theme') || 'system';
      var dark = stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="icon" href="/public/favicon/favicon.ico" sizes="any" />
  <link rel="manifest" href="/public/manifest.json" />
  <title>Loading…</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">
  <div id="navbar"></div>

  <main id="main-content" class="mx-auto max-w-2xl px-4 sm:px-6 lg:px-8 py-16">
    <h1 class="text-3xl font-bold mb-2">Get in touch</h1>
    <p id="contact-intro" class="text-slate-600 dark:text-slate-400 mb-10"></p>

    <form id="contact-form" novalidate class="space-y-5" aria-describedby="form-status">
      <div>
        <label for="name" class="block text-sm font-medium mb-1">Name</label>
        <input id="name" name="name" type="text" required autocomplete="name"
          class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div>
        <label for="email" class="block text-sm font-medium mb-1">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email"
          class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div>
        <label for="message" class="block text-sm font-medium mb-1">Message</label>
        <textarea id="message" name="message" rows="5" required
          class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      </div>
      <!-- Honeypot field: hidden from sighted/keyboard users, catches simple bots -->
      <div class="hidden" aria-hidden="true">
        <label for="company">Company</label>
        <input id="company" name="company" type="text" tabindex="-1" autocomplete="off" />
      </div>
      <button type="submit" id="contact-submit"
        class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition-colors disabled:opacity-60">
        Send message
      </button>
      <p id="form-status" role="status" aria-live="polite" class="text-sm"></p>
    </form>

    <section class="mt-16 pt-10 border-t border-slate-200 dark:border-slate-800">
      <h2 class="text-lg font-semibold mb-3">Other ways to reach me</h2>
      <ul class="space-y-1 text-sm text-slate-600 dark:text-slate-400">
        <li>Email: <a id="contact-email" href="#" class="text-indigo-600 dark:text-indigo-400 hover:underline"></a></li>
        <li id="contact-location"></li>
      </ul>
    </section>
  </main>

  <div id="footer"></div>
  <script type="module" src="/assets/js/pages/contact.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <script>
    (function () {
      var stored = localStorage.getItem('portfolio-theme') || 'system';
      var dark = stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <title>Page not found</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased min-h-screen flex items-center justify-center">
  <div class="text-center px-6">
    <p class="text-7xl font-bold text-indigo-600 dark:text-indigo-400 mb-4">404</p>
    <h1 class="text-2xl font-semibold mb-2">Page not found</h1>
    <p class="text-slate-600 dark:text-slate-400 mb-8">The page you're looking for doesn't exist or has moved.</p>
    <a href="/index.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition-colors">
      Back to home
    </a>
  </div>
</body>
</html>
